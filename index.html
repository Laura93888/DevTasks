<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DevFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="principal">

    <!-- Menú lateral -->
    <aside class="barra-lateral">

      <a class="logo" href="#/panel">DevFlow</a>

      <nav class="navegacion" aria-label="Navegación principal">
        <a class="enlace-navegacion activo" href="#/panel" aria-current="page">
          Panel
        </a>

        <a class="enlace-navegacion" href="#/proyectos">
          Proyectos
        </a>

        <a class="enlace-navegacion" href="#/tareas">
          Tareas
        </a>
      </nav>

    </aside>


    <!-- Contenido principal -->
    <main class="contenido">

      <!-- PANEL -->
      <div class="vista" id="vista-panel">

        <header class="cabecera-pagina">
          <h1>
            Buenos días,
            <span id="nombre-usuario">Laura</span>
          </h1>

          <button class="boton" type="button">
            Nuevo proyecto
          </button>
        </header>


        <!-- Resumen -->
        <section class="estadisticas" aria-label="Resumen">

          <article class="tarjeta estadistica">
            <p class="valor-estadistica" id="total-proyectos">0</p>
            <p class="etiqueta-estadistica">Proyectos</p>
          </article>

          <article class="tarjeta estadistica">
            <p class="valor-estadistica" id="total-tareas">0</p>
            <p class="etiqueta-estadistica">Tareas</p>
          </article>

          <article class="tarjeta estadistica">
            <p class="valor-estadistica" id="total-pendientes">0</p>
            <p class="etiqueta-estadistica">Pendientes</p>
          </article>

        </section>


        <!-- Proyectos activos -->
        <section aria-labelledby="proyectos-activos">

          <h2 id="proyectos-activos">
            Proyectos activos
          </h2>

          <div class="proyectos" id="lista-proyectos-activos">

            <!-- Los proyectos se generan desde JavaScript -->

          </div>

        </section>

      </div>


      <!-- PROYECTOS -->
      <div class="vista" id="vista-proyectos" hidden>

        <header class="cabecera-pagina">

          <h1>Proyectos</h1>

          <button class="boton" type="button">
            Nuevo proyecto
          </button>

        </header>


        <div class="proyectos" id="lista-proyectos">

          <!-- Los proyectos se generan desde JavaScript -->

        </div>

      </div>


      <!-- TAREAS -->
      <div class="vista" id="vista-tareas" hidden>

        <header class="cabecera-pagina">

          <h1>Tareas</h1>

          <button class="boton" type="button" id="abrir-modal-tarea">
            Nueva tarea
          </button>

        </header>


        <!-- Buscador y filtros -->
        <div class="barra-herramientas">

          <input
            class="buscador"
            id="buscador-tareas"
            type="search"
            placeholder="Buscar tarea..."
            aria-label="Buscar tarea"
          >


          <div
            class="pestanas"
            role="group"
            aria-label="Filtrar por estado"
          >

            <button class="pestana activa" type="button" data-filtro="todas" aria-pressed="true">
              Todas
            </button>

            <button class="pestana" type="button" data-filtro="pendiente" aria-pressed="false">
              Pendientes
            </button>

            <button class="pestana" type="button" data-filtro="en-curso" aria-pressed="false">
              En curso
            </button>

            <button class="pestana" type="button" data-filtro="completada" aria-pressed="false">
              Completadas
            </button>

          </div>

        </div>


        <!-- Lista de tareas -->
        <ul class="lista-tareas" id="lista-tareas">

          <!-- Las tareas se generan desde JavaScript -->

        </ul>

      </div>

    </main>

  </div>


  <!-- Modal: nueva tarea -->
  <dialog class="modal" id="modal-tarea">
    <form class="formulario" id="formulario-tarea">

      <h2 id="titulo-modal-tarea">Nueva tarea</h2>

      <label class="campo">
        <span>Título</span>
        <input type="text" name="titulo" required maxlength="80">
      </label>

      <label class="campo">
        <span>Proyecto</span>
        <select name="proyectoId" required></select>
      </label>

      <div class="campos-fila">

        <label class="campo">
          <span>Prioridad</span>
          <select name="prioridad">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </label>

        <label class="campo">
          <span>Estado</span>
          <select name="estado">
            <option value="pendiente" selected>Pendiente</option>
            <option value="en-curso">En curso</option>
            <option value="completada">Completada</option>
          </select>
        </label>

      </div>

      <div class="acciones-formulario">
        <button class="boton boton-secundario" type="button" id="cancelar-tarea">Cancelar</button>
        <button class="boton" type="submit" id="boton-guardar-tarea">Crear tarea</button>
      </div>

    </form>
  </dialog>


  <!-- Modal: confirmar borrado de tarea -->
  <dialog class="modal modal--confirmar" id="modal-borrar">
    <div class="formulario">

      <h2>Borrar tarea</h2>

      <p class="texto-secundario" id="texto-borrar"></p>

      <div class="acciones-formulario">
        <button class="boton boton-secundario" type="button" id="cancelar-borrar">Cancelar</button>
        <button class="boton boton-peligro" type="button" id="confirmar-borrar">Borrar</button>
      </div>

    </div>
  </dialog>


  <script type="module" src="main.js"></script>

</body>
</html>
